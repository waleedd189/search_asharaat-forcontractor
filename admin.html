<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الأدمن — الاشارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surf:#0f1829;--surf2:#111e2e;--brd:#1e2d4a;--blue:#2563eb;--blue2:#1d4ed8;--green:#10b981;--red:#ef4444;--txt:#e2e8f0;--muted:#475569}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
#loginScreen.hide{display:none}
.lbox{width:100%;max-width:360px;background:var(--surf);border:1px solid var(--brd);border-radius:24px;padding:36px 28px;text-align:center}
.lico{font-size:48px;margin-bottom:14px}
.ltitle{font-size:22px;font-weight:900;color:#fff;margin-bottom:4px}
.lsub{font-size:13px;color:var(--muted);margin-bottom:24px}
.linp{width:100%;background:rgba(255,255,255,0.05);border:1.5px solid var(--brd);border-radius:12px;padding:13px 16px;color:var(--txt);font-family:'Cairo',sans-serif;font-size:15px;outline:none;text-align:center;letter-spacing:3px;margin-bottom:12px;transition:border-color .2s}
.linp:focus{border-color:var(--blue)}
.lbtn{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;border-radius:12px;padding:14px;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.lerr{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:10px;color:#fca5a5;font-size:13px;margin-top:10px;display:none}

/* APP */
#adminApp{display:none;min-height:100vh}
.topbar{background:rgba(10,14,26,0.97);border-bottom:1px solid var(--brd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:38px;height:38px;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.brand-name{font-size:15px;font-weight:900;color:#fff}
.brand-sub{font-size:11px;color:#3b82f6}
.btn-logout{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;border-radius:8px;padding:7px 14px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer}

.main{padding:20px;max-width:640px;margin:0 auto}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:16px;text-align:center}
.stat-val{font-size:32px;font-weight:900;color:#3b82f6}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px}

/* SECTION */
.sec{background:var(--surf);border:1px solid var(--brd);border-radius:20px;padding:20px;margin-bottom:16px}
.sec-title{font-size:15px;font-weight:900;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* ADD */
.add-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.inp{flex:1;min-width:140px;background:rgba(255,255,255,0.05);border:1.5px solid var(--brd);border-radius:10px;padding:10px 14px;color:var(--txt);font-family:'Cairo',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}
.btn-add{background:linear-gradient(135deg,var(--green),#059669);border:none;border-radius:10px;padding:10px 18px;color:#fff;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.btn-add:disabled{opacity:0.6;cursor:not-allowed}

/* LIST */
.user-item{background:rgba(255,255,255,0.03);border:1px solid var(--brd);border-radius:12px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;transition:.15s}
.user-item:hover{background:rgba(255,255,255,0.05)}
.user-info{display:flex;flex-direction:column;gap:3px}
.user-name{font-size:14px;font-weight:700;color:#fff}
.user-email{font-size:12px;color:#3b82f6;direction:ltr;text-align:right}
.btn-del{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;border-radius:8px;padding:6px 14px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-del:hover{background:rgba(239,68,68,0.2)}
.empty-list{text-align:center;padding:30px;color:var(--muted);font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);border-radius:12px;padding:11px 22px;font-size:13px;font-weight:700;z-index:999;transition:transform .3s ease;white-space:nowrap;pointer-events:none;font-family:'Cairo',sans-serif}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:#052e16;border:1px solid #16a34a;color:#4ade80}
.toast.err{background:#200a0a;border:1px solid #7f1d1d;color:#fca5a5}

.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:30px;color:var(--muted)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lbox">
    <div class="lico">🔐</div>
    <div class="ltitle">لوحة الأدمن</div>
    <div class="lsub">نظام إدارة الاشارات</div>
    <input class="linp" type="password" id="pw" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="lbtn" onclick="checkPw()">دخول ←</button>
    <div class="lerr" id="pwErr">❌ كلمة المرور غلط</div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <div class="topbar">
    <div class="brand">
      <div class="brand-ico">🚦</div>
      <div>
        <div class="brand-name">لوحة الأدمن</div>
        <div class="brand-sub">إدارة الاشارات</div>
      </div>
    </div>
    <button class="btn-logout" onclick="doLogout()">خروج</button>
  </div>

  <div class="main">

    <!-- STATS -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="statCount">—</div>
        <div class="stat-lbl">إجمالي المقاولين</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statNew">—</div>
        <div class="stat-lbl">مضاف اليوم</div>
      </div>
    </div>

    <!-- ADD USER -->
    <div class="sec">
      <div class="sec-title">➕ إضافة مقاول جديد</div>
      <div class="add-row">
        <input type="text" class="inp" id="newName" placeholder="الاسم">
        <input type="email" class="inp" id="newEmail" placeholder="example@gmail.com"
          onkeydown="if(event.key==='Enter')addUser()">
      </div>
      <button class="btn-add" id="addBtn" onclick="addUser()">
        ✅ إضافة
      </button>
    </div>

    <!-- USERS LIST -->
    <div class="sec">
      <div class="sec-title">👥 المقاولين المصرح ليهم</div>
      <div id="usersList"><div class="loading"><div class="spin"></div></div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const ADMIN_PASS = 'admin2026';

const firebaseConfig = {
  apiKey: "AIzaSyCmLfaEb7lPCWaqiQLNRsqWUjuTya4xWF0",
  authDomain: "asharaat-search.firebaseapp.com",
  projectId: "asharaat-search",
  storageBucket: "asharaat-search.firebasestorage.app",
  messagingSenderId: "930583092172",
  appId: "1:930583092172:web:89aaf88198c3b1d1195b69"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── LOGIN ──────────────────────────────────────────
window.checkPw = function(){
  var pw = document.getElementById('pw').value;
  if(pw === ADMIN_PASS){
    document.getElementById('loginScreen').classList.add('hide');
    document.getElementById('adminApp').style.display = 'block';
    loadUsers();
  } else {
    document.getElementById('pwErr').style.display = 'block';
  }
};

window.doLogout = function(){
  document.getElementById('loginScreen').classList.remove('hide');
  document.getElementById('adminApp').style.display = 'none';
  document.getElementById('pw').value = '';
};

// ── LOAD USERS ─────────────────────────────────────
var allUsers = [];

async function loadUsers(){
  document.getElementById('usersList').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  try {
    var snap = await getDocs(collection(db,'contractors'));
    allUsers = snap.docs.map(function(d){ return {id:d.id, ...d.data()}; });
    renderUsers();
    updateStats();
  } catch(e){
    document.getElementById('usersList').innerHTML = '<div class="empty-list">❌ خطأ: '+e.message+'</div>';
  }
}

function renderUsers(){
  var el = document.getElementById('usersList');
  if(!allUsers.length){
    el.innerHTML = '<div class="empty-list">مفيش مقاولين مضافين لحد دلوقتي</div>';
    return;
  }
  el.innerHTML = allUsers.map(function(u){
    return '<div class="user-item">'
      + '<div class="user-info">'
      + '<div class="user-name">'+(u.name||'—')+'</div>'
      + '<div class="user-email">'+(u.email||'—')+'</div>'
      + '</div>'
      + '<button class="btn-del" onclick="delUser(\''+u.id+'\',\''+u.name+'\')">🗑 حذف</button>'
      + '</div>';
  }).join('');
}

function updateStats(){
  document.getElementById('statCount').textContent = allUsers.length;
  var today = new Date().toDateString();
  var todayCount = allUsers.filter(function(u){
    if(!u.createdAt) return false;
    var d = u.createdAt.toDate ? u.createdAt.toDate() : new Date(u.createdAt);
    return d.toDateString() === today;
  }).length;
  document.getElementById('statNew').textContent = todayCount;
}

// ── ADD USER ───────────────────────────────────────
window.addUser = async function(){
  var name  = document.getElementById('newName').value.trim();
  var email = document.getElementById('newEmail').value.trim().toLowerCase();
  var btn   = document.getElementById('addBtn');

  if(!name){ toast('⚠️ أدخل الاسم','err'); return; }
  if(!email || !email.includes('@')){ toast('⚠️ أدخل إيميل صحيح','err'); return; }
  if(allUsers.find(function(u){ return u.email===email; })){ toast('⚠️ الإيميل موجود بالفعل','err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جاري الإضافة...';

  try {
    await addDoc(collection(db,'contractors'),{
      name: name,
      email: email,
      createdAt: serverTimestamp()
    });
    document.getElementById('newName').value  = '';
    document.getElementById('newEmail').value = '';
    toast('✅ تم إضافة '+name,'ok');
    await loadUsers();
  } catch(e){
    toast('❌ خطأ: '+e.message,'err');
  }
  btn.disabled = false;
  btn.innerHTML = '✅ إضافة';
};

// ── DELETE USER ────────────────────────────────────
window.delUser = async function(id, name){
  if(!confirm('هتحذف '+name+'؟')) return;
  try {
    await deleteDoc(doc(db,'contractors',id));
    toast('تم حذف '+name,'ok');
    await loadUsers();
  } catch(e){
    toast('❌ خطأ: '+e.message,'err');
  }
};

// ── TOAST ──────────────────────────────────────────
var tt;
function toast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show '+(type||'ok');
  clearTimeout(tt);
  tt = setTimeout(function(){ el.classList.remove('show'); }, 3000);
}
</script>
</body>
</html>
